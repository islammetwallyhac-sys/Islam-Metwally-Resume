  *{box-sizing:border-box;}
  body{margin:0; background:var(--ink); color:var(--text); font-family:'Cairo','IBM Plex Sans',sans-serif;}
  .top{position:sticky; top:0; z-index:20; background:rgba(18,22,27,0.95); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:14px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;}
  .top h1{font-size:16px; margin:0; font-weight:600;}
  .top .sub{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-dim);}
  .actions{display:flex; gap:8px; flex-wrap:wrap;}
  button, .filebtn{
    font-family:'Cairo',sans-serif; font-size:13px; font-weight:600;
    border:1px solid var(--brass); background:transparent; color:var(--brass-bright);
    padding:9px 16px; border-radius:4px; cursor:pointer; transition:background .2s;
  }
  button:hover, .filebtn:hover{background:rgba(184,144,90,0.14);}
  button.solid{background:var(--brass); color:var(--ink);}
  button.solid:hover{background:var(--brass-bright);}
  button.danger{border-color:var(--danger); color:var(--danger);}
  button.danger:hover{background:rgba(201,118,100,0.14);}
  input[type=file]{display:none;}

  .layout{display:grid; grid-template-columns:1fr 1fr; gap:0; height:calc(100vh - 60px);}
  @media(max-width:980px){.layout{grid-template-columns:1fr; height:auto;}}
  .form-pane{overflow-y:auto; padding:24px; border-left:1px solid var(--line);}
  @media(max-width:980px){.form-pane{border-left:none; border-bottom:1px solid var(--line);}}
  .preview-pane{background:#0c0f13; position:sticky; top:60px; align-self:start; height:calc(100vh - 60px);}
  @media(max-width:980px){.preview-pane{position:static; height:70vh;}}
  .preview-pane iframe{width:100%; height:100%; border:none;}

  fieldset{border:1px solid var(--line); border-radius:6px; margin-bottom:22px; padding:16px; }
  legend{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--brass-bright); padding:0 8px;}
  label{display:block; font-size:12.5px; color:var(--text-dim); margin:12px 0 4px;}
  input[type=text], textarea{
    width:100%; background:#10141a; border:1px solid var(--line); color:var(--text);
    border-radius:4px; padding:9px 10px; font-family:'IBM Plex Sans',sans-serif; font-size:13.5px;
  }
  textarea{min-height:64px; resize:vertical;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .card{border:1px solid var(--line); border-radius:6px; padding:14px; margin-bottom:12px; background:rgba(184,144,90,0.03);}
  .card-head{display:flex; justify-content:space-between; align-items:center;}
  .card-head b{font-size:13px;}
  .hint{font-size:11px; color:var(--text-dim); margin-top:4px;}
  .add-btn{margin-top:8px;}
  .checkbox-row{display:flex; align-items:center; gap:8px; margin-top:10px;}
  .status-msg{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ok);}
</style>
</head>

/* ============ FORM RENDERING ============ */
const pane = document.getElementById('formPane');

function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==='html') e.innerHTML = v; else e.setAttribute(k,v);
  });
  (Array.isArray(children)?children:[children]).forEach(c=>{ if(c) e.appendChild(c); });
  return e;
}
function field(labelText, value, onChange, multiline=false){
  const wrap = document.createElement('div');
  wrap.appendChild(el('label',{html:labelText}));
  const input = multiline ? el('textarea') : el('input',{type:'text'});
  input.value = value || '';
  input.addEventListener('input', ()=>onChange(input.value));
  wrap.appendChild(input);
  return wrap;
}

function buildForm(){

  row1.appendChild(field('الخبرة (Rev)', data.hero.rev, v=>data.hero.rev=v));
  fsHero.appendChild(row1);

  row2.appendChild(field('الحالة (Status)', data.hero.status, v=>data.hero.status=v));
  row2.appendChild(field('سنة الإصدار', data.hero.issued, v=>data.hero.issued=v));
  fsHero.appendChild(row2);
  fsHero.appendChild(field('حروف الختم (Stamp)', data.hero.stamp, v=>data.hero.stamp=v));
  fsHero.appendChild(field('اسم ملف السيرة الذاتية PDF', data.hero.cvFile, v=>data.hero.cvFile=v));

  fsHero.appendChild(cvHint);

  /* --- ABOUT --- */

  fsAbout.appendChild(field('الفقرات — كل فقرة في سطر منفصل', data.about.paragraphs.join('\n'), v=>data.about.paragraphs = v.split('\n').filter(x=>x.trim()!==''), true));

  pane.appendChild(fsAbout);

  /* --- EXPERIENCE --- */
  const fsExp = el('fieldset',{},[el('legend',{html:'الخبرات (Experience)'})]);
  data.experience.forEach((e,i)=>{

    del.onclick = ()=>{ data.experience.splice(i,1); buildForm(); };

      });
    }, true));
    const cb = el('div',{class:'checkbox-row'});
    const cbInput = el('input',{type:'checkbox'}); cbInput.checked = !!p.wide;
    cbInput.onchange = ()=> p.wide = cbInput.checked;
    cb.appendChild(cbInput);
    cb.appendChild(el('span',{html:'عرض كامل (بطاقة تمتد على العرض بالكامل)'}));
    card.appendChild(cb);
    fsProj.appendChild(card);
  });
  const addProj = el('button',{class:'add-btn'}); addProj.textContent='+ إضافة مشروع جديد';
  addProj.onclick = ()=>{ data.projects.push({num:`PRJ / ${String(data.projects.length+1).padStart(2,'0')}`,title:'',desc:'',links:[],wide:false}); buildForm(); };

  const linksFs = el('div',{},[el('label',{html:'روابط التواصل الاجتماعي'})]);
  ['linkedin','behance','instagram','facebook','website'].forEach(key=>{
    linksFs.appendChild(field(key, data.contact.links[key], v=>data.contact.links[key]=v));
  });
  linksFs.appendChild(field('whatsapp (رقم بدون + وبدون مسافات، مثال 20106...)', data.contact.links.whatsapp, v=>data.contact.links.whatsapp=v));
  fsContact.appendChild(linksFs);
  pane.appendChild(fsContact);

  /* --- FOOTER --- */
  const fsFooter = el('fieldset',{},[el('legend',{html:'تذييل الصفحة (Footer)'})]);
  fsFooter.appendChild(field('نص التذييل', data.footer, v=>data.footer=v));
  pane.appendChild(fsFooter);
}

function refreshPreview(){
  document.getElementById('previewFrame').srcdoc = siteTemplate(JSON.stringify(data));
}

/* ============ FILE LOAD / DOWNLOAD ============ */
document.getElementById('fileInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt){
    try{
      data = JSON.parse(evt.target.result);
      buildForm();
      refreshPreview();
      alert('تم تحميل الملف بنجاح');
    }catch(err){
      alert('الملف غير صالح: ' + err.message);
    }
  };
  reader.readAsText(file);
});

function downloadJson(){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'content.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ============ INIT ============ */
buildForm();
refreshPreview();
